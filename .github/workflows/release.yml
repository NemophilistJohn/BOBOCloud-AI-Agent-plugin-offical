name: Release plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run release:check
        if: startsWith(github.ref, 'refs/tags/')
      - run: npm run package
      - id: artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          echo "package=artifacts/bobocloud.ai-agent-${version}.boboplugin" >> "$GITHUB_OUTPUT"
          echo "checksum=artifacts/bobocloud.ai-agent-${version}.boboplugin.sha256" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.artifact.outputs.package }}
            ${{ steps.artifact.outputs.checksum }}
